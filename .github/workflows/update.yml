name: Update job market data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # every Monday, 6:00 AM UTC

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch job postings
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python fetch_jobs.py

      - name: Run analysis
        run: python analyze.py

      - name: Commit updated data and charts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs_raw.csv top_skills.png top_cities.png experience_split.png
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update job market data"
          git push
